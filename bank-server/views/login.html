<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Horizon Bank - Secure Sign In (IT-30001 CSRF Lab)</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">🏦</div>
        <h1 style="font-size: 1.6rem; font-weight: 700; color: white;">Apex Horizon Bank</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.4rem;">
          Cyber Security (IT-30001) Lab &bull; CSRF Variant 2
        </p>
      </div>

      <div id="error-alert" style="display: none;" class="alert alert-danger"></div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="e.g. alice" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">Sign In to Online Banking</button>
      </form>

      <div class="credentials-hint">
        <div style="font-weight: 600; margin-bottom: 0.3rem;">⚡ Quick-Fill Demo Credentials:</div>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
          <button type="button" class="btn-secondary" style="flex: 1;" onclick="fillLogin('alice', 'password123')">
            Victim: Alice ($5,000)
          </button>
          <button type="button" class="btn-secondary" style="flex: 1;" onclick="fillLogin('bob', 'password123')">
            User: Bob ($2,500)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Check error query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error) {
      const alert = document.getElementById('error-alert');
      alert.textContent = decodeURIComponent(error);
      alert.style.display = 'flex';
    }

    function fillLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
